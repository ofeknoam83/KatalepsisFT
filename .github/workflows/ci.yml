name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore KatalepsisFT.sln
      - run: dotnet build KatalepsisFT.sln -c Release --no-restore
      - run: dotnet test KatalepsisFT.sln -c Release --no-build
      # The job Render runs before every release. Its services are checked on start, so one that is missing fails here.
      - name: Run the pre-release job's migration step
        run: dotnet run --project src/KatalepsisFT.Jobs -c Release --no-build -- migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/KatalepsisFT.Web/ClientApp/package-lock.json
      - name: Build the Angular app
        working-directory: src/KatalepsisFT.Web/ClientApp
        run: npm ci && npx ng build
      - name: Build the image Render will run
        run: docker build -t katalepsis-ft:ci .
