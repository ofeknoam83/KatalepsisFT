# Katalepsis FT on Render: one production environment.
services:
  - type: web
    name: katalepsis-ft-web
    runtime: docker
    region: frankfurt
    plan: starter
    numInstances: 2
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/run.sh web
    healthCheckPath: /health
    preDeployCommand: /app/run.sh jobs deploy
    autoDeployTrigger: checksPass
    buildFilter:
      paths: [src/**, Dockerfile, run.sh, global.json, Directory.Build.props]
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: katalepsis-ft-db, property: connectionString }
      - key: KEYVALUE_URL
        fromService: { type: keyvalue, name: katalepsis-ft-kv, property: connectionString }
      # First Admin, created by the migrate step only while the system has no account at all.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true

  - type: worker
    name: katalepsis-ft-worker-core
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/run.sh worker core
    autoDeployTrigger: checksPass
    buildFilter: &workerFilter
      paths: [src/**, Dockerfile, run.sh, global.json, Directory.Build.props]
      ignoredPaths: [src/KatalepsisFT.Web/**]
    envVars: &workerEnv
      - key: DATABASE_URL
        fromDatabase: { name: katalepsis-ft-db, property: connectionString }
      - key: KEYVALUE_URL
        fromService: { type: keyvalue, name: katalepsis-ft-kv, property: connectionString }

  - type: worker
    name: katalepsis-ft-worker-cefi
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/run.sh worker cefi
    autoDeployTrigger: checksPass
    buildFilter: *workerFilter
    envVars: *workerEnv

  - type: worker
    name: katalepsis-ft-worker-defi
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/run.sh worker defi
    autoDeployTrigger: checksPass
    buildFilter: *workerFilter
    envVars: *workerEnv

  # Loads yesterday's prices and brings the demo fund up to date, shortly after the day closes (UTC).
  - type: cron
    name: katalepsis-ft-daily
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "20 0 * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/run.sh jobs demo
    autoDeployTrigger: checksPass
    buildFilter: *workerFilter
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: katalepsis-ft-db, property: connectionString }

  - type: keyvalue
    name: katalepsis-ft-kv
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: [] # private network only

databases:
  - name: katalepsis-ft-db
    region: frankfurt
    plan: basic-256mb
    databaseName: katalepsis_ft
    user: katalepsis_ft
    postgresMajorVersion: "17"
