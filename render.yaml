# Katalepsis FT on Render: one production environment.
services:
  - type: web
    name: katalepsis-ft-web
    runtime: docker
    region: frankfurt
    plan: starter
    numInstances: 2
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/run.sh web
    healthCheckPath: /health
    preDeployCommand: /app/run.sh jobs deploy
    autoDeployTrigger: checksPass
    buildFilter:
      paths: [src/**, Dockerfile, run.sh, global.json, Directory.Build.props]
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: katalepsis-ft-db, property: connectionString }
      - key: KEYVALUE_URL
        fromService: { type: keyvalue, name: katalepsis-ft-kv, property: connectionString }
      # First Admin, created by the migrate step only while the system has no account at all.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - fromGroup: katalepsis-ft-secrets

  - type: worker
    name: katalepsis-ft-worker-core
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/run.sh worker core
    autoDeployTrigger: checksPass
    buildFilter: &workerFilter
      paths: [src/**, Dockerfile, run.sh, global.json, Directory.Build.props]
      ignoredPaths: [src/KatalepsisFT.Web/**]
    envVars: &workerEnv
      - key: DATABASE_URL
        fromDatabase: { name: katalepsis-ft-db, property: connectionString }
      - key: KEYVALUE_URL
        fromService: { type: keyvalue, name: katalepsis-ft-kv, property: connectionString }
      - fromGroup: katalepsis-ft-secrets

  - type: worker
    name: katalepsis-ft-worker-cefi
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/run.sh worker cefi
    autoDeployTrigger: checksPass
    buildFilter: *workerFilter
    envVars: *workerEnv

  - type: worker
    name: katalepsis-ft-worker-defi
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/run.sh worker defi
    autoDeployTrigger: checksPass
    buildFilter: *workerFilter
    envVars: *workerEnv

  # The execution service: market data streams, the order engine and the trading-key vault. It alone holds
  # EXEC_MASTER_KEY, the key that opens stored trading keys; if that value is ever changed, every stored trading key
  # becomes unreadable and has to be entered again. One copy acts on orders at a time; a second would stand by.
  - type: worker
    name: katalepsis-ft-worker-exec
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/run.sh worker exec
    autoDeployTrigger: checksPass
    buildFilter: *workerFilter
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: katalepsis-ft-db, property: connectionString }
      - key: KEYVALUE_URL
        fromService: { type: keyvalue, name: katalepsis-ft-kv, property: connectionString }
      - key: EXEC_MASTER_KEY
        generateValue: true

  # Loads yesterday's prices and brings the demo fund up to date, shortly after the day closes (UTC).
  - type: cron
    name: katalepsis-ft-daily
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "20 0 * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/run.sh jobs demo
    autoDeployTrigger: checksPass
    buildFilter: *workerFilter
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: katalepsis-ft-db, property: connectionString }

  - type: keyvalue
    name: katalepsis-ft-kv
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: [] # private network only

# The master key that venue API keys are encrypted with. Generated once by Render and shared by the web service and the
# workers; if it is ever changed, every stored venue key becomes unreadable and has to be entered again.
envVarGroups:
  - name: katalepsis-ft-secrets
    envVars:
      - key: MASTER_KEY
        generateValue: true
      # The mail account scheduled reports are sent from. Any provider's SMTP details work. Left empty, nothing is
      # sent and the Reports page says so. Set them in the Render dashboard, under this environment group.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: katalepsis-ft-db
    region: frankfurt
    plan: basic-256mb
    databaseName: katalepsis_ft
    user: katalepsis_ft
    postgresMajorVersion: "17"
    # No address outside Render may connect: the services reach the database over the private network.
    ipAllowList: []
